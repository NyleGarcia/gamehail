# Star Citizen - the first gamehail module.
#
# Copy this file to ~/.config/gamehail/games/ to change it; a module of the same id
# there wins over this one, so your edits survive an update.

[game]
id = "star-citizen"
name = "Star Citizen"
# Matched against running process names. Proton reports the Windows executable.
detect = ["StarCitizen.exe", "RSI Launcher", "StarCitizen_Launcher"]
model = "sonnet"
effort = "low"
allowed_tools = ["Read", "mcp__scmcp"]

system_prompt = """
Live Star Citizen assistant. Pilot is mid-flight, cannot read. ONE short sentence,
ONE fact - the number or name asked for, nothing bundled alongside it. No preamble, no
hedging, no markdown, no lists, no "let me check". If more detail would help, offer to
give it ("want the buy price too?") instead of including it unasked.

Always use scmcp tools for prices, terminals, routes, ships, items - never memory, the
economy changes every patch. Budget: your best-guess lookup, then if that misses, ONE
more with an adjusted spelling or the wiki catalog instead of a live price search
(hyphens, spacing and digits are exactly where speech-to-text garbles a name - "JS300"
is "JS-300"). Two tool calls, then answer with whatever you have. Do not keep guessing
past that.

The question came from speech-to-text and may be garbled ("vera 2 comp later" for
"Vera Compensator2"). Never end a reply with a question, and never ask the pilot to
spell, confirm, or repeat anything - voice input cannot do any of that, so it is a
dead end every time. Pick your best match yourself and answer for it. If nothing
plausible turns up after the one extra lookup above, say so in a single flat sentence
("Nothing by that name.") and stop there - do not invite a follow-up.
"""

# Words Whisper has never met. Without these it hears "lara night" for laranite.
#
# Two tiers: this list (vocabulary_static) is hand-picked and always present - ships,
# locations, jargon that isn't a tradeable item and so nothing generates it. Below it,
# vocabulary_generated is regenerated by scripts/vocab/star-citizen.py from SCMCP's
# sc_get_vocabulary tool (commodities, manufacturers, and any locally extracted names -
# see that script's docstring for the local-then-API precedence). Don't hand-edit
# vocabulary_generated; a script run will overwrite it.
vocabulary_static = [
  "Star Citizen", "aUEC", "SCU", "quantum drive", "quantanium", "laranite",
  "agricium", "titanium", "diamond", "gold", "bexalite", "hadanite", "medical supplies",
  "Stanton", "Pyro", "Hurston", "Lorville", "ArcCorp", "Area 18", "microTech",
  "New Babbage", "Crusader", "Orison", "Port Olisar", "Grim HEX", "Everus Harbor",
  "Baijini Point", "Port Tressler", "Ruin Station", "Checkmate", "Orbituary",
  "Constellation", "Andromeda", "Caterpillar", "Hercules", "Starfarer", "Prospector",
  "MOLE", "Reclaimer", "Vulture", "Corsair", "Cutlass", "Freelancer", "Hull C",
  "Carrack", "Polaris", "Idris", "Redeemer", "Vanguard", "Gladius", "Arrow", "Hornet",
]

