[project]
name = "gamehail"
version = "0.1.0"
description = "Hotkey gaming assistant: push-to-talk / screenshot -> Claude Code headless + game MCP -> TTS + overlay"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "evdev>=1.7",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.1",
    "piper-tts>=1.2",
    "PyQt6>=6.7",
    "tomli-w>=1.2.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.25.1.1",
]

[project.scripts]
gamehail = "gamehail.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamehail"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
